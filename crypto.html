<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FTY Dashboard — Crypto SELL · Multi-Timeframe Scanner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050912;color:#eef3ff;font:14px 'Segoe UI',Arial,sans-serif;min-height:100vh}
header{padding:14px 22px;background:linear-gradient(135deg,#0d1526,#0a1020);border-bottom:1px solid #1e2d4a;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.title{font-size:22px;font-weight:900;letter-spacing:-.5px}
.title span{background:linear-gradient(90deg,#36d48a,#4777ff,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:#8f9db8;font-size:12px}
.wrap{max-width:1400px;margin:auto;padding:16px}
.sat-info-panel{background:linear-gradient(135deg,#0a1424,#0d1a30);border:1px solid #1e2d4a;border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:11px}
.sat-info-panel .si-item{display:flex;align-items:center;gap:6px;color:#8f9db8}
.sat-info-panel .si-item b{color:#eef3ff;font-weight:700}
.sat-countdown{font-variant-numeric:tabular-nums;font-weight:800;color:#36d48a;font-size:13px}
.satcom-badge{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;font-size:10px;font-weight:800;letter-spacing:.5px;background:linear-gradient(135deg,rgba(54,212,138,.12),rgba(71,119,255,.12));border:1px solid #36d48a44;color:#36d48a}
.satcom-badge.syncing{border-color:#4777ff;color:#6ba3ff;animation:satSync 1s ease-in-out infinite}
@keyframes satSync{0%,100%{box-shadow:0 0 4px #4777ff44}50%{box-shadow:0 0 14px #4777ffaa}}
.sig-bars{display:inline-flex;gap:2px;align-items:flex-end;height:10px}
.sig-bars span{width:2px;background:currentColor;border-radius:1px}
.sat-wrap{position:relative;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.sat-orbit{position:absolute;width:30px;height:30px;border:1.5px solid #4777ff30;border-radius:50%;animation:satOrbit 8s linear infinite}
@keyframes satOrbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.sat-dot{position:absolute;width:4px;height:4px;background:#36d48a;border-radius:50%;box-shadow:0 0 6px #36d48a;animation:satDotOrbit 8s linear infinite}
@keyframes satDotOrbit{from{transform:rotate(0deg) translateX(15px) rotate(0deg)}to{transform:rotate(360deg) translateX(15px) rotate(-360deg)}}
.overview{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.ov-card{cursor:pointer;transition:transform .15s,border-color .2s}
.ov-card:hover{transform:translateY(-2px);border-color:#4777ff;box-shadow:0 4px 12px rgba(71,119,255,.2)}
.ov-card.active{border-color:#36d48a;background:linear-gradient(145deg,#0d2818,#0a1f15)}
.ov-card .num{font-size:22px;font-weight:900}
.ov-card .lbl{font-size:10px;color:#8f9db8;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.ov-card{background:linear-gradient(145deg,#0e1b30,#0b1525);border:1px solid #1a2840;border-radius:10px;padding:12px;text-align:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
button{background:#0f1a30;color:#fff;border:1px solid #2a3a5a;border-radius:8px;padding:9px 18px;font-size:12px;cursor:pointer;font-weight:700;transition:transform .1s,background .2s,box-shadow .2s}
button:hover{background:#16243f;transform:translateY(-1px);box-shadow:0 4px 12px rgba(71,119,255,.2)}
button:disabled{opacity:.5;cursor:wait;transform:none}
.btn-ema{font-size:15px;padding:12px 28px;font-weight:900}
.btn-ema.active{background:linear-gradient(135deg,#1a4d3a,#0d3328);border-color:#36d48a;color:#36d48a;box-shadow:0 4px 20px rgba(54,212,138,.3)}
.btn-ema:not(.active){background:linear-gradient(135deg,#0f1a30,#16243f);border-color:#1a2840;color:#8f9db8}
.btn-copy{background:linear-gradient(135deg,#1a304d,#0d2033);border-color:#4777ff;color:#6ba3ff}
.btn-export{background:linear-gradient(135deg,#3a2a1a,#33200d);border-color:#ff9c40;color:#ff9c40}
.btn-sat-sync{background:linear-gradient(135deg,#0d2033,#1a304d);border-color:#a855f7;color:#c89eff}
.btn-clear{background:linear-gradient(135deg,#3a1a1a,#2a0d0d);border-color:#ff6b6b;color:#ff6b6b}
.ema-search-box{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex:1;min-width:250px}
.ema-search-box input{flex:1;background:#0a1220;border:1px solid #2a3a5a;color:#eef3ff;padding:10px 16px;border-radius:8px;font-size:13px;font-family:inherit}
.ema-search-box input:focus{outline:none;border-color:#4777ff;box-shadow:0 0 0 3px rgba(71,119,255,.1)}
.seg{display:flex;background:#0f1a30;border:1px solid #1a2840;border-radius:8px;overflow:hidden}
.seg button{background:none;border:none;color:#8f9db8;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.seg button.active{background:#4777ff;color:#fff}
.seg button:hover:not(.active){color:#fff}
.count{color:#8f9db8;font-size:12px;margin-left:auto}
.scan-status{background:linear-gradient(135deg,#0a1424,#0d1a30);border:1px solid #1e2d4a;border-left:3px solid #4777ff;border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:12px;color:#b8c4dc;display:none}
.scan-status.show{display:block;animation:fadeIn .3s}
.scan-status .loader{display:inline-block;width:14px;height:14px;border:2px solid #4777ff40;border-top-color:#4777ff;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.scan-progress-bar{height:6px;background:#0a1220;border-radius:3px;margin-top:8px;overflow:hidden}
.scan-progress-fill{height:100%;background:linear-gradient(90deg,#36d48a,#4777ff,#a855f7);border-radius:3px;transition:width .3s;width:0%}
.scan-results{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;max-height:300px;overflow-y:auto}
.scan-result-chip{background:linear-gradient(135deg,#0d2033,#1a304d);border:1px solid #2a3d5e;border-radius:6px;padding:5px 10px;font-size:11px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;transition:all .2s;animation:fadeIn .3s}
.scan-result-chip:hover{border-color:#36d48a;transform:translateY(-1px)}
.scan-result-chip .chip-sym{font-weight:700;color:#eef3ff}
.scan-result-chip .chip-dist{color:#f87171;font-size:10px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.dash-tile{background:linear-gradient(145deg,#0e1b30,#0b1525);border:1px solid #1a2840;border-radius:10px;padding:14px;text-align:center}
.dash-tile .dt-num{font-size:24px;font-weight:900}
.dash-tile .dt-lbl{font-size:10px;color:#8f9db8;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.dash-sec{background:linear-gradient(145deg,#0e1b30,#0b1525);border:1px solid #1a2840;border-radius:12px;padding:16px;margin-bottom:14px}
.dash-sec h3{font-size:13px;color:#8f9db8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.dash-cols{grid-template-columns:1fr}}
.dash-mut{font-size:12px;color:#8f9db8;line-height:1.6}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-lbl{width:110px;font-size:12px;font-weight:700;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:16px;background:#0a1220;border-radius:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;min-width:2px}
.bar-val{width:70px;font-size:11px;color:#8f9db8;font-variant-numeric:tabular-nums}
.lb-row{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;transition:background .15s}
.lb-row:hover{background:#101c33}
.lb-rank{width:26px;font-weight:900;color:#4777ff;font-size:12px}
.lb-sym{width:120px;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-sym a{color:#eef3ff;text-decoration:none}
.lb-sym a:hover{color:#36d48a}
.lb-track{flex:1;height:14px;background:#0a1220;border-radius:7px;overflow:hidden}
.lb-fill{height:100%;background:linear-gradient(90deg,#36d48a,#4777ff);border-radius:7px}
.lb-val{width:70px;text-align:right;font-weight:800;color:#36d48a;font-size:12px;font-variant-numeric:tabular-nums}
.ema-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ema-chip{cursor:pointer;background:linear-gradient(145deg,#0e1b30,#0b1525);border:1px solid #1a2840;border-radius:20px;padding:8px 16px;font-size:12px;font-weight:800;color:#8f9db8;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.ema-chip span{background:#0a1220;border-radius:10px;padding:1px 8px;font-size:11px;font-variant-numeric:tabular-nums}
.ema-chip:hover{border-color:#4777ff;color:#eef3ff;transform:translateY(-1px)}
.ema-chip.on{background:linear-gradient(135deg,#1a4d3a,#0d3328);border-color:#36d48a;color:#36d48a;box-shadow:0 4px 14px rgba(54,212,138,.25)}
.cc-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;background:linear-gradient(145deg,#0e1b30,#0b1525);border:1px solid #1a2840;border-radius:12px;padding:14px 18px}
.cc-title{font-size:22px;font-weight:900;letter-spacing:-.5px}
.cc-title small{font-size:11px;color:#8f9db8;font-weight:700;letter-spacing:1px;margin-left:6px}
.cc-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fmt-seg button{padding:8px 12px;font-size:11px}
.fmt-seg button.active{background:#4777ff;color:#fff}
.movers{display:flex;flex-direction:column;gap:4px}
.mover-chip{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;font-size:12.5px}
.mover-chip:hover{background:#101c33}
.mover-chip a{color:#eef3ff;text-decoration:none;font-weight:700;flex:1}
.mover-chip a:hover{color:#36d48a}
.mover-chip b{font-variant-numeric:tabular-nums;font-size:12px}
.pill-copy{background:none;border:none;cursor:pointer;font-size:12px;opacity:.45;transition:opacity .15s}
.mover-chip:hover .pill-copy{opacity:1}
.bucket-card{background:linear-gradient(145deg,#0e1b30,#0b1525);border:1px solid #1a2840;border-radius:12px;padding:14px;margin-bottom:12px}
.bucket-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.bucket-lbl{font-size:13px;font-weight:800}
.bucket-copy{background:#0a1220;border:1px solid #2a3a5a;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.bucket-copy:hover{background:#16243f;transform:translateY(-1px)}
.sym-grid{display:flex;flex-wrap:wrap;gap:6px}
.sym-pill2{cursor:pointer;background:#0a1220;border:1px solid #1f2d47;border-radius:14px;padding:4px 10px;font-size:11.5px;font-weight:700;color:#dfe7f5;display:inline-flex;align-items:center;gap:5px;transition:all .12s}
.sym-pill2 i{font-style:normal;font-size:10px;color:#8f9db8;font-variant-numeric:tabular-nums}
.sym-pill2:hover{border-color:#36d48a;color:#36d48a;transform:translateY(-1px)}
.sym-pill2:hover i{color:#36d48a}
#liveCountBadge{background:#a855f7;color:#fff;border-radius:8px;padding:1px 7px;font-size:10px;margin-left:4px}
/* ── Timeframe tabs (Weekly / Daily / Monthly) ── */
#tfTabs{display:inline-flex;gap:4px;background:#0a1220;border:1px solid #1a2840;border-radius:10px;padding:4px}
.tf-tab{background:none;border:none;border-radius:8px;color:#8f9db8;font-size:12px;font-weight:800;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;font-family:inherit}
.tf-tab span{background:#0a1220;border-radius:9px;padding:1px 7px;font-size:10px;font-variant-numeric:tabular-nums}
.tf-tab:hover{color:#eef3ff;background:#16243f}
.tf-tab.on{background:linear-gradient(135deg,#4777ff,#a855f7);color:#fff;box-shadow:0 4px 14px rgba(71,119,255,.35)}
.tf-tab.on span{background:rgba(0,0,0,.35);color:#fff}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stock-card{background:linear-gradient(145deg,#0e1b30,#0b1525);border:1px solid #1a2840;border-radius:10px;padding:12px;cursor:pointer;transition:transform .15s,border-color .2s;position:relative;overflow:hidden}
.stock-card:hover{transform:translateY(-2px);border-color:#2a4a6a}
.stock-card.strong{border-left:3px solid #36d48a}
.stock-card.buy{border-left:3px solid #f87171}
.stock-card.neutral{border-left:3px solid #8f9db8}
.sc-rank{position:absolute;top:8px;right:10px;font-size:9px;color:#8f9db8;font-weight:700}
.sc-name{font-size:14px;font-weight:800;color:#eef3ff}
.sc-name a{color:#4777ff;text-decoration:none}
.sc-name a:hover{text-decoration:underline}
.sc-exch{font-size:10px;color:#8f9db8}
.sc-price{font-size:18px;font-weight:800;margin:4px 0}
.sc-ema{font-size:11px;color:#8f9db8;margin-bottom:4px}
.ec-dist{font-size:12px;font-weight:700;margin-bottom:6px}
.sc-score{font-size:13px;font-weight:700;margin-bottom:4px}
.sc-score.strong{color:#36d48a}.sc-score.buy{color:#4777ff}.sc-score.neutral{color:#ffc800}
.sc-signal{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;margin-left:4px}
.sc-signal.strong{background:rgba(54,212,138,.15);color:#36d48a}
.sc-signal.buy{background:rgba(248,113,113,.15);color:#f87171}
.sc-signal.neutral{background:rgba(255,200,0,.15);color:#ffc800}
.ec-patterns{margin-bottom:6px}
.ema-badge{display:inline-block;font-size:9px;padding:2px 7px;border-radius:5px;font-weight:700;margin-right:3px;margin-bottom:2px}
.ema-badge.never-broke{background:rgba(54,212,138,.15);color:#36d48a;border:1px solid #36d48a55}
.ema-badge.hammer{background:rgba(255,200,0,.12);color:#ffc800;border:1px solid #ffc80055}
.ema-badge.pinbar{background:rgba(168,85,247,.12);color:#c89eff;border:1px solid #a855f755}
.ema-badge.bullish{background:rgba(54,212,138,.12);color:#36d48a;border:1px solid #36d48a44}
.ema-badge.near{background:rgba(71,119,255,.12);color:#6ba3ff;border:1px solid #4777ff55}
.ema-badge.new-sat{background:rgba(168,85,247,.15);color:#a855f7;border:1px solid #a855f755}
.sc-streak{font-size:10px;color:#8f9db8;margin-bottom:4px}
.sc-reason{font-size:10px;color:#b8c4dc;margin-bottom:6px;line-height:1.4;min-height:28px}
.sc-confidence{margin-top:4px;font-size:10px;color:#8f9db8}
.conf-bar{height:4px;border-radius:2px;background:#1a2840;margin-top:3px;overflow:hidden}
.conf-fill{height:100%;border-radius:2px}
.conf-fill.strong{background:linear-gradient(90deg,#36d48a,#4777ff)}
.conf-fill.buy{background:linear-gradient(90deg,#4777ff,#a855f7)}
.conf-fill.neutral{background:#8f9db8}
.copy-sym-btn{position:absolute;top:8px;left:10px;background:rgba(71,119,255,.15);border:1px solid #4777ff44;color:#6ba3ff;border-radius:5px;padding:2px 7px;font-size:9px;font-weight:700;cursor:pointer;opacity:0;transition:opacity .2s}
.stock-card:hover .copy-sym-btn{opacity:1}
.full-list{width:100%;border-collapse:collapse;font-size:12px;background:linear-gradient(180deg,#0c1729,#0a1424);border-radius:10px;overflow:hidden}
.full-list th{background:#0d1a30;padding:10px;text-align:left;font-size:11px;color:#8f9db8;text-transform:uppercase;border-bottom:1px solid #1e2d4a;position:sticky;top:0}
.full-list td{padding:8px 10px;border-bottom:1px solid #121d33}
.full-list tr:hover{background:#0f1a30}
.full-list .sym{font-weight:800;color:#eef3ff}
.full-list .sym a{color:#4777ff;text-decoration:none}
.full-list .sym a:hover{text-decoration:underline}
.full-list .tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:4px;margin-right:2px}
.batch-card{background:linear-gradient(135deg,#0d1a30,#0a1424);border:1px solid #1e2d4a;border-radius:14px;padding:0;margin-bottom:16px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.batch-card:hover{transform:translateY(-3px);border-color:#36d48a55;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.batch-card-header{background:linear-gradient(90deg,#0f3328,#0d1a30);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2d4a}
.batch-num-badge{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:#36d48a}
.batch-num-badge .batch-dot{width:8px;height:8px;border-radius:50%;background:#36d48a;box-shadow:0 0 8px #36d48a}
.batch-info-text{font-size:11px;color:#8f9db8;font-weight:600}
.batch-symbols{padding:14px 18px;display:flex;flex-wrap:wrap;gap:6px}
.sym-pill{display:inline-block;background:linear-gradient(135deg,#0e1b30,#16243f);border:1px solid #1a2840;color:#6ba3ff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;font-family:'Segoe UI',sans-serif;transition:all .15s;cursor:default}
.sym-pill:hover{border-color:#4777ff;color:#4777ff;transform:scale(1.05)}
.batch-actions{padding:10px 18px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-copy-batch{background:linear-gradient(135deg,#1a4d3a,#0d3328);border:1px solid #36d48a;color:#36d48a;padding:8px 22px;font-size:12px;border-radius:20px;cursor:pointer;font-weight:700;transition:all .2s;letter-spacing:.3px}
.btn-copy-batch:hover{box-shadow:0 4px 16px rgba(54,212,138,.4);transform:translateY(-2px)}
.batch-hidden-text{position:absolute;left:-9999px;opacity:0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:linear-gradient(145deg,#0d1526,#0a1020);border:1px solid #1e2d4a;border-radius:14px;padding:24px;max-width:500px;width:90%}
.modal h3{font-size:18px;font-weight:900;margin-bottom:14px;color:#36d48a}
.modal textarea{width:100%;height:200px;background:#050912;border:1px solid #1a2840;color:#36d48a;padding:14px;border-radius:8px;font-size:13px;font-family:monospace;resize:vertical}
.modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.toast{position:fixed;bottom:24px;right:24px;background:linear-gradient(135deg,#0d2818,#0a1f15);border:1px solid #36d48a;color:#36d48a;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:300;transform:translateX(400px);transition:transform .3s}
.toast.show{transform:translateX(0)}
.ema-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
@media(max-width:768px){
.cards{grid-template-columns:repeat(2,1fr)}
.overview{grid-template-columns:repeat(3,1fr)}
.btn-ema{font-size:13px;padding:10px 18px}
}
/* ── Batch Copy Deck v2 ── */
.batch-cmd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:linear-gradient(145deg,#0e1b30,#0b1525);border:1px solid #1a2840;border-radius:12px;padding:12px 16px;margin-bottom:12px}
.batch-cmd .bc-title{font-size:13px;font-weight:800;letter-spacing:.3px}
.batch-cmd .bc-sub{font-size:11px;color:#8f9db8;margin-top:2px}
.batch-cmd .seg{display:inline-flex;gap:2px}
.batch-stack{display:grid;gap:10px}
.batch-item{background:linear-gradient(145deg,#0e1b30,#0b1525);border:1px solid #1a2840;border-radius:12px;padding:12px 14px;transition:border-color .15s,opacity .2s}
.batch-item.next{border-color:#36d48a;box-shadow:0 0 0 1px rgba(54,212,138,.22),0 6px 20px rgba(54,212,138,.08)}
.batch-item.done{opacity:.4}
.batch-item.copied{border-color:rgba(54,212,138,.3)}
.bi-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.bi-tag{font-size:11px;font-weight:900;letter-spacing:.6px;color:#8f9db8;text-transform:uppercase}
.batch-item.next .bi-tag{color:#36d48a}
.bi-count{font-size:10px;color:#8f9db8}

if(exFilter!=='ALL')rows=rows.filter(r=>r.ex===exFilter);
if(activeFilter==='strong')rows=rows.filter(r=>r.signal==='STRONG SELL');
else if(activeFilter==='followers')rows=rows.filter(r=>(r.score||0)>=70);
else if(activeFilter==='fresh')rows=rows.filter(r=>r.fresh);
else if(activeFilter==='setup')rows=rows.filter(r=>(r.patterns||[]).length>0);
if(searchQuery){
let q=searchQuery.toLowerCase();
rows=rows.filter(r=>r.symbol.toLowerCase().includes(q)||(r.name||'').toLowerCase().includes(q));
}
return rows}

async function loadCandlesTF(sym,ex,t){
let m=TF_META[t||TF];
// ── PRIMARY: Binance klines — full OHLC, direct, no proxy ──
try{
let lim=(m.interval==='5m'||m.interval==='15m'||m.interval==='30m'||m.interval==='1h')?1000:500;
let k=await bzKlines(bzSym(sym),BIN_TF[m.interval],lim);
if(Array.isArray(k)&&k.length>10){
let ts=[],q={open:[],high:[],low:[],close:[]};
k.forEach(row=>{ts.push(Math.floor(row[0]/1000));q.open.push(+row[1]);q.high.push(+row[2]);q.low.push(+row[3]);q.close.push(+row[4]);});
let out={ts:ts,q:q};
if(m.agg)out=aggCandles(out,m.agg);
return out;
}
}catch(e){}
let u='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(yfSym(sym))+'?range='+m.range+'&interval='+m.interval;
// Route order: known-good proxy FIRST (shared with the scan's goodIdx), then
// other proxies, direct LAST (direct is CORS-blocked for file:// most days —
// trying it first wasted ~8s per stock during OHLC enrichment).
let _order=[];
let _gr=(typeof window._goodRoute==='number')?window._goodRoute:-1;
if(_gr>0)_order.push(PROXIES[_gr]);
PROXIES.slice(1,5).forEach(p=>{if(_order.indexOf(p)<0)_order.push(p);});
let urls=_order.map(p=>p(u));urls.push(u);
for(let uu of urls){try{
let r=await fetchTO(uu,8000);if(!r.ok)continue;
let t=await r.text();let b=t.indexOf('{'),e2=t.lastIndexOf('}');if(b<0||e2<=b)continue;
let j=JSON.parse(t.slice(b,e2+1));
let res=j&&j.chart&&j.chart.result&&j.chart.result[0];
if(res&&res.timestamp&&res.indicators&&res.indicators.quote[0]){let out={ts:res.timestamp,q:res.indicators.quote[0]};if(m.agg)out=aggCandles(out,m.agg);return out;}
}catch(e){}}
return null;
}
async function loadCandles(sym,ex){return loadCandlesTF(sym,ex,TF);}
function drawStockChart(cv,ts,q,P,showLegend=true){
let closes=q.close.map(c=>c==null?null:c);
let valid=closes.map((c,i)=>({c,i})).filter(o=>o.c!=null);
if(valid.length<P+5)return false;
let emaS=computeEMASeries(valid.map(o=>o.c),P);
let all=valid.map((o,k)=>({ts:ts[o.i],c:o.c,l:q.low[o.i],h:q.high[o.i],e:emaS[k]}));
let N=Math.min(120,all.length);
let view=all.slice(-N);
let lo=Math.min.apply(null,view.map(v=>Math.min(v.l,v.e)))*0.995;
let hi=Math.max.apply(null,view.map(v=>Math.max(v.h,v.e)))*1.005;
let ctx=cv.getContext('2d');let W=cv.width,H=cv.height,pad=8;
let X=i=>pad+(W-2*pad)*i/(N-1), Y=v=>pad+(H-2*pad)*(1-(v-lo)/(hi-lo));
ctx.clearRect(0,0,W,H);
// EMA line (gold)
ctx.strokeStyle='#e8c064';ctx.lineWidth=1.6;ctx.beginPath();
view.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v.e)):ctx.moveTo(X(i),Y(v.e)));ctx.stroke();
// Candles
view.forEach((v,i)=>{
let up=v.c>=v.c0||v.c>=(v.cPrev==null?v.c:v.cPrev);
ctx.strokeStyle=up?'#5fd6a2':'#f87171';ctx.fillStyle=up?'#5fd6a2':'#f87171';ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(X(i),Y(v.h));ctx.lineTo(X(i),Y(v.l));ctx.stroke();
let bw=Math.max(1.5,(W-2*pad)/N*0.55);
let top=Y(Math.max(v.c,(v.cPrev==null?v.c:v.cPrev))),bot=Y(Math.min(v.c,(v.cPrev==null?v.c:v.cPrev)));
ctx.fillRect(X(i)-bw/2,top,bw,Math.max(1,bot-top));
});
// EMA test / rejection markers (last 60 bars)
let s2=Math.max(0,N-60);
for(let i=s2;i<N;i++){
let e=view[i].e,h=view[i].h,c=view[i].c;
if(h>=e*0.98){
let rej=c<e;
ctx.fillStyle=rej?'#5fd6a2':'#f87171';
ctx.beginPath();ctx.arc(X(i),Y(h)-6,3,0,7);ctx.fill();
}}
if(showLegend){ctx.fillStyle='#64748f';ctx.font='10px Segoe UI';
ctx.fillText(TF_META[TF].lbl+' · '+P+' EMA line (gold) · dots = EMA tests (green = held, red = broke)',pad,H-4);}
return true;
}

const BIN_TF={'5m':'5m','15m':'15m','30m':'30m','1h':'1h','1d':'1d','1wk':'1w','1mo':'1M'};
function bzSym(s){s=String(s);return (s.endsWith('-USD')?s.slice(0,-4):s.endsWith('USD')?s.slice(0,-3):s)+'USDT';}   // BTC-USD / BTCUSD -> BTCUSDT
async function bzKlines(sym,interval,limit){
let hosts=(typeof window._bzHost==='string')?[window._bzHost].concat(BIN_HOSTS.filter(h=>h!==window._bzHost)):BIN_HOSTS.slice();
for(let h of hosts){
try{
let r=await fetchTO(h+'/api/v3/klines?symbol='+sym+'&interval='+interval+'&limit='+limit,9000);
if(!r.ok)continue;let k=await r.json();
if(Array.isArray(k)&&k.length){window._bzHost=h;return k;}
}catch(e){}
}
return null;
}
// fetch() with a hard timeout — without this a hung proxy stalls the scan forever
function fetchTO(u,ms){
let c=new AbortController();let t=setTimeout(()=>c.abort(),ms||9000);
return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(t));
}


// ═══ FTY FOLLOWER ENGINE ═══
// EMA series aligned 1:1 with closes (seeded from first close)
function computeEMASeries(closes,P){
let k=2/(P+1),out=[],e=closes[0];
for(let i=0;i<closes.length;i++){e=i?closes[i]*k+e*(1-k):closes[0];out.push(e);}
return out;
}
// Scan the active trend regime, not the stock's whole listing history.
// The windows remain strict: every close in the selected window must hold above EMA.
// They are shorter on higher timeframes because each bar represents more time.
function cleanRespectStart(n,P,t){
let windows={
 D:{201:100,101:75,51:55,21:40,11:28},
 W:{201:60,101:45,51:32,21:24,11:16},
 M:{201:30,101:24,51:18,21:12,11:8},
 I5:{201:250,101:200,51:150,21:100,11:75},
 I15:{201:220,101:170,51:120,21:80,11:55},
 I30:{201:200,101:150,51:110,21:70,11:50},
 I60:{201:150,101:120,51:90,21:60,11:40},
 I120:{201:120,101:100,51:75,21:50,11:35},
 I180:{201:110,101:90,51:70,21:45,11:30},
 I240:{201:100,101:80,51:60,21:40,11:28}
};
let bars=(windows[t]||windows.W)[P]||P;
return Math.max(P-1,n-bars);
}
// CANDLE-PATTERN SETUP DETECTION — candle-level rules, identical on Weekly/Daily/Monthly.
// Returns array of {type,label,detail} like the original scanner: near / hammer / pinbar / bullish.
function detectPatterns(closes,lows,highs,emaS,P){
let n=closes.length;if(!n)return[];
let ema=emaS[n-1];let pats=[];
// Near EMA ≤2% (same rule as the original 201-EMA scanner)
let dist=Math.abs(closes[n-1]-ema)/ema*100;
if(dist<=2)pats.push({type:'near',label:'Near (2%)',detail:'Price within 2% of '+P+' EMA'});
// Look at the last 4 candles — recent setup counts (Shooting Star/Bearish Pin often fire on a prev bar)
let s0=Math.max(1,n-4);
for(let i=s0;i<n;i++){
let c=closes[i],prev=closes[i-1],l=lows[i],h=highs[i],be=emaS[i];   // be = THIS bar's EMA
if(c==null||prev==null||l==null||h==null||be==null)continue;
let rng=h-l;if(rng<=0)continue;
let body=Math.abs(c-prev);
let lower=c>=prev?c-l:l-c;          // lower wick: from body edge
let upper=h-(c>=prev?c:prev);
// Big-bar timeframes (W/D/M): a bar OPENS at the prior close — so if the prior
// close sat near the level, THIS bar genuinely traded from the level. Classic
// "Shooting Star (prev)" style detection — bear mirror of the original 201-EMA scanner.
let openedNear=prev>=be*0.96;                       // prior close within 4% below the level
let touched=h>=be*0.96;                             // wick reached up to the level this bar
let interact=openedNear||touched;
if(!interact)continue;
// HAMMER: lower wick >= 2x body, small upper wick
if(upper>=2*body&&lower<=0.35*rng){
pats.push({type:'shootingstar',label:i===n-1?'Shooting Star':'Shooting Star (prev)',detail:'Long upper wick rejection from '+P+' level'});}
// PIN BAR (bullish): long LOWER wick ≥ 60% of range, small upper wick, close holds above the level
if(upper>=0.6*rng&&upper>=3*lower&&c<be){
pats.push({type:'bearishpin',label:i===n-1?'Bearish Pin':'Bearish Pin (prev)',detail:'Bearish pin bar at '+P+' resistance'});}
// BULLISH candle: solid green candle off the level
if(c<prev&&body>=0.5*rng&&body<=2.5*rng){
pats.push({type:'bearish',label:i===n-1?'Bearish':'Bearish (prev)',labelPrev:true,detail:'Strong bearish candle near '+P+' level'});}
}
// dedupe by type, keep most recent first
let seen={};return pats.filter(p=>seen[p.type]?false:(seen[p.type]=true));
}
// CLEAN FOLLOWER ANALYSIS for one stock on one EMA.
// Qualify: price ABOVE EMA + clean support regime. For 21/11, the supplied
// chart style is assessed over the latest 60/40 bars; longer EMAs stay lifetime-strict.
// (close<ema counts as a break; a wick below the EMA does NOT).
// Score: exactly 100 points across 8 components, clamped 0..100.
function analyzeFollower(closes,lows,highs,P,t){
if(!t)t=TF;
let n=closes.length;
if(n<P+10)return null;                     // insufficient history → UNKNOWN, never fake
let emaS=computeEMASeries(closes,P);
let last=closes[n-1],ema=emaS[n-1];
if(!(last<ema))return null;                 // must be BELOW
let distPct=(ema-last)/ema*100;             // positive = distance BELOW the EMA
// Daily 21/11 also admits high-respect trends (up to 30% closes below support);
// zero-break followers retain the perfect flag and rank above every other result.
let respectStart=cleanRespectStart(n,P,t);
let respectBars=n-respectStart,breaks=0;
for(let i=respectStart;i<n;i++)if(closes[i]>emaS[i])breaks++;   // break = close ABOVE the EMA
let neverBroke=breaks===0,isDailyShort=t==='D'&&(P===21||P===11),isIntra=(t||'').charAt(0)==='I';
// Daily 21/11 and ALL intraday levels admit high-respect trends (intraday bars
// are far noisier, so their bar is a bit looser); zero-break followers still
// outrank everything and keep the perfect flag.
if(!neverBroke&&(!(isDailyShort||isIntra)||breaks/respectBars>(isIntra?0.35:0.30)))return null;
let look=Math.min(60,n-P);                  // interaction window
let s0=n-look;
// 1. Support respect 20 — zero breaks earns the full score.
let pRespect=Math.round(20*(respectBars-breaks)/respectBars);
// 2+3. Interactions 15 / Rejections 15 — pullbacks toward the EMA that held.
// A "test" = low reaches within 2% of the EMA (exact touch not required).
let tests=0,rejections=0,failed=0,lastRejIdx=-1;
// Adaptive proximity: tight followers get flagged at 1.5%, wide ones at 4%
let testBand=Math.min(4,Math.max(1.5,distPct*0.8));
for(let i=s0;i<n;i++){
if(highs[i]>=emaS[i]*(1-testBand/100)){
tests++;
if(closes[i]<emaS[i]){rejections++;lastRejIdx=i;}else failed++;
}
}
let pInteract=Math.round(15*Math.min(1,tests/4));
let pReject=Math.round(15*Math.min(1,rejections/3));
// 4. Proximity 10 — close is good, extended is penalized
let pProx=distPct<=1.5?10:distPct<=3?7:distPct<=5?4:Math.max(0,6-distPct*0.15);
pProx=Math.round(Math.max(0,Math.min(10,pProx)));
// 5. Slope 10 — EMA direction vs 10 bars ago
let ref=Math.max(0,n-11);let slopePct=(emaS[n-1]-emaS[ref])/emaS[ref]*100;
let slope=slopePct<-2?'Strong Falling':slopePct<-0.3?'Falling':slopePct<0.3?'Flat':'Rising';
let pSlope=slope==='Strong Falling'?10:slope==='Falling'?7:slope==='Flat'?4:0;
// 6. Structure 10 — higher highs + higher lows in the window
let lh=0,ll=0;for(let i=s0+1;i<n;i++){if(highs[i]<highs[i-1])lh++;if(lows[i]<lows[i-1])ll++;}
let pStruct=Math.round(10*Math.min(1,(lh+ll)/(2*(look-1))*1.6));   // lower highs + lower lows
// 7. Continuation 10 — price extended after the most recent rejection
let pCont=0;
if(lastRejIdx>=0){let drop=(last-closes[lastRejIdx])/closes[lastRejIdx]*100;pCont=drop<-2?10:drop<-0.5?6:last<closes[lastRejIdx]?3:0;}else pCont=distPct<=5?5:0;
// 8. Failed-test control 10 — clean followers have zero breaks
let pFail=tests?Math.round(10*(1-failed/tests)):10;
if(!neverBroke)pFail=Math.min(pFail,Math.round(10*(1-breaks/respectBars)));
let score=Math.max(0,Math.min(100,pRespect+pInteract+pReject+pProx+pSlope+pStruct+pCont+pFail));
let grade=neverBroke&&score>=90?'PERFECT':score>=80?'STRONG':score>=70?'GOOD':score>=60?'MODERATE':'WEAK';
// Fresh setup detection (recent window per timeframe)
let win=t==='D'?15:t==='W'?8:(t&&t.charAt(0)==='I')?10:4;
let w0=n-win;let setup='';
let nearLast=false;for(let i=Math.max(s0,w0);i<n;i++)if(highs[i]>=emaS[i]*(1-testBand/100))nearLast=true;
let consTight=true;for(let i=n-5;i<n;i++)if(Math.abs(closes[i]-emaS[i])/emaS[i]>0.03)consTight=false;
if(nearLast&&last<closes[n-2])setup='EMA Rejection';
else if(nearLast)setup='EMA Retest';
else if(consTight)setup='Consolidation Near EMA';
else if(last<=Math.min.apply(null,closes.slice(-20)))setup='Bearish Continuation';
else if(distPct<=2)setup='EMA Resistance';
let fresh=!!setup&&lastRejIdx>=w0||(!!setup&&setup!=='');
fresh=!!setup;
let signal='NO SIGNAL';
if(neverBroke&&score>=90&&fresh&&(slope==='Strong Falling'||slope==='Falling'))signal='STRONG SELL';
else if(score>=80&&fresh)signal='SELL';
else if(score>=70)signal='WATCH';
let pats=detectPatterns(closes,lows,highs,emaS,P);
let breakdown=[
{lbl:'Historical Respect',got:pRespect,max:20},
{lbl:'Interactions',got:pInteract,max:15},
{lbl:'Rejections',got:pReject,max:15},
{lbl:'Proximity',got:pProx,max:10},
{lbl:'EMA Slope',got:pSlope,max:10},
{lbl:'Price Structure',got:pStruct,max:10},
{lbl:'Continuation',got:pCont,max:10},
{lbl:'Failure Control',got:pFail,max:10}
];
return {last:last,ema:Math.round(ema*100)/100,distPct:+distPct.toFixed(2),neverBroke:neverBroke,respectBars:respectBars,breaks:breaks,score:score,grade:grade,tests:tests,rejections:rejections,failed:failed,slope:slope,setup:setup,fresh:fresh,signal:signal,breakdown:breakdown,emaS:emaS,patterns:pats};
}

// ── INTRADAY AGGREGATION: Yahoo has no native 2h/3h/4h interval, so those
// timeframes fetch 1h bars and merge every N consecutive bars that belong to
// the SAME trading session (bucket close = last close in the group, high/low =
// max/min of the group). Timestamps are bar-start (UTC).
function _istDay(ts){return Math.floor(ts/86400);}   // UTC day split — crypto trades 24/7
function sparkAgg(j,N){
if(!j||!j.spark||!j.spark.result)return j;
for(let s of j.spark.result){
let ch=s.response&&s.response[0];if(!ch)continue;
let ts=ch.timestamp||[];let q=(ch.indicators||{}).quote||[{}];let cl=(q[0]&&q[0].close)||[];
if(!ts.length||cl.length<2*N)continue;
let nts=[],nc=[],day=null,k=0;
for(let i=0;i<cl.length;i++){
if(cl[i]==null)continue;
let d=_istDay(ts[i]);
if(d!==day){day=d;k=0;}
if(k%N===0){nts.push(ts[i]);nc.push(cl[i]);}
else if(nc.length)nc[nc.length-1]=cl[i];
k++;
}
ch.timestamp=nts;if(q[0])q[0].close=nc;
}
return j;
}
function aggCandles(res,N){
let ts=res.ts,q=res.q,cl=q.close||[];
let nt=[],nc=[],no=[],nh=[],nl=[],day=null,k=0;
for(let i=0;i<cl.length;i++){
if(cl[i]==null)continue;
let d=_istDay(ts[i]);
if(d!==day){day=d;k=0;}
if(k%N===0){nt.push(ts[i]);nc.push(cl[i]);no.push(q.open?q.open[i]:null);nh.push(q.high?q.high[i]:null);nl.push(q.low?q.low[i]:null);}
else if(nc.length){
let li=nc.length-1;nc[li]=cl[i];
if(q.open&&q.open[i]!=null&&no[li]==null)no[li]=q.open[i];
if(q.high&&q.high[i]!=null)nh[li]=(nh[li]==null)?q.high[i]:Math.max(nh[li],q.high[i]);
if(q.low&&q.low[i]!=null)nl[li]=(nl[li]==null)?q.low[i]:Math.min(nl[li],q.low[i]);
}
k++;
}
return {ts:nt,q:{open:no,high:nh,low:nl,close:nc}};
}

// Live scan via CORS proxies
async function liveScan(){

async function fetchBinanceList(ms){

const hosts=BN_HOSTS;
const STABLES={USDT:1,USDC:1,FDUSD:1,TUSD:1,BUSD:1,DAI:1,USDP:1,PYUSD:1,USD1:1,USDE:1,FRAX:1,EUR:1,EURI:1,AEUR:1,GBP:1,TRY:1,BRL:1,ARS:1,EGP:1,PAXG:1};

}
// INTERNET-DRIVEN UNIVERSE: the exact Binance spot list — fresh every scan,

TFS.forEach(t=>{liveData[t]={};});
$('scanMsg').textContent='🛰️ Daily + Weekly + Monthly + Intraday — Universe: '+universeSrc+' — scanning ALL...';

// Sticky good proxy: once a proxy works, reuse it FIRST — skips dead proxies.
let goodIdx=-1;
async function fetchSpark(qs,stf){

{

window._bzMem[memKey]=jz;

}
let u='https://query1.finance.yahoo.com/v7/finance/spark?symbols='+qs+'&range='+m.range+'&interval='+m.interval;
let memKey=u+(m.agg?'|a'+m.agg:'');   // 2h/3h/4h share the same 1h URL — keep caches separate

// L2: localStorage candles (4h TTL) — survives refresh; daily bars rarely change

// helper: fetch text via one proxy and extract the JSON object (handles jina's
// "Title...Markdown Content:" wrapper AND plain JSON)
async function tryOne(i){
let r=await fetchTO(proxies[i](u),9000);
if(!r.ok)return null;

let s=t.indexOf('{'),e2=t.lastIndexOf('}');

}
if(goodIdx>=0){try{let j=await tryOne(goodIdx);if(j){if(m.agg)j=sparkAgg(j,m.agg);window._sparkMem[memKey]=j;return j;}}catch(e){}}
for(let i=0;i<proxies.length;i++){

try{let j=await tryOne(i);if(j){if(m.agg)j=sparkAgg(j,m.agg);goodIdx=i;window._goodRoute=i;window._sparkMem[memKey]=j;

// Batches of 20 (spark limit), 8 requests in parallel → up to 160 symbols in flight
let BS=20,CONC=12,retryQ=[],workList=candidates,wptr=0,lastSaveTs=Date.now();
// GLOBAL PACING: one queue gates request STARTS (min gap between spark calls).
// Without this, 12 workers burst-flood the 2-3 live proxies → Yahoo 429s every
// route → 0 results. Paced ~4 req/s keeps routes alive; cache makes re-scans instant.
let _lastReq=0;
async function paced(){let gap=(typeof window._bzHost==='string')?500:250;let w=_lastReq+gap-Date.now();if(w>0){_lastReq+=gap;await new Promise(r=>setTimeout(r,w));}else{_lastReq=Date.now();}}   // Binance-direct: 500ms keeps request weight under the 6000/min limit
async function batchWorker(){

await paced();

let q=(ch.indicators||{}).quote||[{}];
// ── STAGE 1: closes-only qualify — EVERY timeframe in ONE pass ──
// Yahoo's spark endpoint returns CLOSES ONLY (low/high empty). The spec's
// PRIMARY conditions — price above EMA + clean support regime — are
// closes-only checks, so the SAME closes qualify the stock on all 5 levels ×
// all 3 timeframes (Daily/Weekly/Monthly) in one go. Stage 2 later enriches
// with real OHLC (Shooting Star/Bearish Pin/tests/full score).
let C=q[0].close||[];
let closes=[];for(let i=0;i<C.length;i++)if(C[i]!=null)closes.push(C[i]);

let lastClose=closes[closes.length-1];

let ex=src.ex||'REST';
for(let P of EMA_PERIODS){
if(closes.length<P+10)continue;               // insufficient history → skip
let emaS=computeEMASeries(closes,P);
let ema=emaS[emaS.length-1];
if(!(lastClose<ema))continue;                 // must be BELOW
let respectStart=cleanRespectStart(closes.length,P,STF),respectBars=closes.length-respectStart,breaks=0;
for(let i=respectStart;i<closes.length;i++)if(closes[i]>emaS[i])breaks++;   // break = close ABOVE the EMA
let neverBroke=breaks===0,isDailyShort=STF==='D'&&(P===21||P===11),isIntra=(STF||'').charAt(0)==='I';
// Broaden Daily 21/11 and ALL intraday levels: accept a strong support
// relationship (Daily ≥70% clean closes, intraday ≥65% — intraday is much
// noisier). Zero-break followers still rank at the very top.
if(!neverBroke&&(!(isDailyShort||isIntra)||breaks/respectBars>(isIntra?0.35:0.30)))continue;
let distPct=+(((ema-lastClose)/ema)*100).toFixed(2);   // distance BELOW the EMA (positive)
let bucket=liveData[STF];if(!bucket[P])bucket[P]=[];
if(bucket[P].find(r=>r.symbol===sym))continue;
// Provisional score (0-100, clamped); Stage-2 OHLC replaces it with the
// full 8-component follower score.
let supportPct=Math.round(100*(respectBars-breaks)/respectBars);
let score=Math.round(Math.max(40,Math.min(90,45+supportPct*.4+Math.min(12,((closes.length-P)/52)*12)-Math.min(15,distPct))));
bucket[P].push({symbol:sym,name:(src.name||sym),ex:ex,price:lastClose,ema:ema,distPct:distPct,neverBroke:neverBroke,respectBars:respectBars,breaks:breaks,patterns:[],streak:0,score:score,signal:neverBroke&&score>=80?'STRONG SELL':score>=70?'SELL':'WATCH',grade:neverBroke&&score>=90?'PERFECT FOLLOWER':score>=80?'STRONG FOLLOWER':score>=70?'GOOD FOLLOWER':score>=60?'MODERATE':'WEAK',tests:0,rejections:0,slope:'—',setup:'',fresh:false,breakdown:null,reasons:['Below '+P+' EMA · '+supportPct+'% resistance respect over '+respectBars+' bars','Provisional score — OHLC enrichment adds patterns/tests','Trading '+distPct+'% below '+P+' EMA'],weekDate:new Date().toISOString().split('T')[0],hasSignal:true,respect:score,lvl:P,lvlTF:STF,needsOHLC:true});
foundBy[P]=(foundBy[P]||0)+1;
foundBy[ex]=(foundBy[ex]||0)+1;
if(STF===TF&&P===currentEMA){let chipHost=$('scanResults');chipHost.insertAdjacentHTML('beforeend',`<div class="scan-result-chip" onclick="copySymbol('${sym}')"><span class="chip-sym">${sym}</span> <span class="chip-dist">↓${distPct}%</span></div>`);}
}
}
}else{retryQ.push(batch);
// BACKOFF: a failure means routes are saturated — pause this worker so the
// burst does not hammer every proxy into hard rate-limits
await new Promise(r=>setTimeout(r,2000+Math.random()*2000));
}
}                                       // ← closes for(let STF of TFS)
done+=batch.length;
// Throttled incremental save + throttled progress UI (DOM updates are slow)
if(Date.now()-lastSaveTs>4000){lastSaveTs=Date.now();saveLive();
let qual=EMA_PERIODS.reduce((s2,P)=>s2+(cur()[P]||[]).length,0);
$('scanMsg').textContent=`Scanning crypto market… ${done}/${total} · ${Math.min(100,Math.round(done/total*100))}% · ${qual} qualified`;
$('scanProgress').style.width=Math.min(100,(done/total)*100)+'%';
// LIVE RESULTS: stocks appear on the dashboard AS they are found (every 4s),
// not only after the whole scan finishes
renderEMAButtons();if(contentVisible)render();}
}
}
let bw=[];for(let i=0;i<Math.min(CONC,Math.ceil(total/BS));i++){bw.push(batchWorker());await new Promise(r=>setTimeout(r,150));}
await Promise.allSettled(bw);

// One targeted retry sweep for failed batches with fresh routing (proxies warm
// up at different times) — rescues them without rescanning the whole universe
if(retryQ.length){
// Multi-round rescue: proxies recover at different times, so wait between
// rounds. A shrinking retryQ = progress; two flat rounds = give up.
let rounds=[15000,25000,35000,45000];
for(let ri=0;ri<rounds.length&&retryQ.length;ri++){
let before=retryQ.length;
let failedBatches=retryQ;retryQ=[];
goodIdx=-1;
$('scanMsg').textContent=`🛰️ Rescuing ${before} batches — round ${ri+1}: waiting ${Math.round(rounds[ri]/1000)}s for routes to recover...`;
await new Promise(r=>setTimeout(r,rounds[ri]));
workList=failedBatches;wptr=0;
let bw2=[];for(let i=0;i<CONC;i++)bw2.push(batchWorker());
await Promise.allSettled(bw2);
if(retryQ.length>=before)break;          // no progress → stop burning time
}
}

// ── STAGE 2: OHLC ENRICHMENT (all timeframes) ────────────
// Qualified rows (top OHLC_CAP per level, provisional score order) get a real
// chart-fetch each on THEIR OWN timeframe; analyzeFollower computes the full
// 8-component score, Shooting Star/Bearish Pin/Bearish/Near patterns, tests/rejections,
// slope and fresh setup. Session cache (window._ohlcMem) keys by TF too.
const OHLC_CAP=120;
for(let t of TFS){for(let P of EMA_PERIODS){
let arr=liveData[t][P];if(!arr||!arr.length)continue;
arr.sort((a,b)=>(b.score||0)-(a.score||0));
arr.forEach((r,i)=>{if(r.needsOHLC)r.needsOHLC=(i<OHLC_CAP);});
}}
let need=[];for(let t of TFS){for(let P of EMA_PERIODS)(liveData[t][P]||[]).forEach(r=>{if(r.needsOHLC===true)need.push(r);});}
if(need.length){
$('scanMsg').textContent='🔬 Enriching '+need.length+' qualified stocks — OHLC patterns/tests (all timeframes)...';
$('scanProgress').style.width='0%';
window._ohlcMem=window._ohlcMem||{};
let nptr=0,ndone=0;
async function ohlcWorker(){
while(nptr<need.length){
let r=need[nptr++];let P=r.lvl||201;let t=r.lvlTF||'W';
let key=t+'|'+r.symbol+'|'+r.ex;
let oh=window._ohlcMem[key];
if(!oh){
await paced();
try{
let ch=await loadCandlesTF(r.symbol,r.ex,t);
if(ch&&ch.q){
let C=ch.q.close||[],Lo=ch.q.low||[],Hi=ch.q.high||[];
let cl=[],lo=[],hi=[];
for(let i=0;i<Math.min(C.length,Lo.length,Hi.length);i++){
if(C[i]==null||Lo[i]==null||Hi[i]==null)continue;
cl.push(C[i]);lo.push(Lo[i]);hi.push(Hi[i]);
}
if(cl.length>20)oh=window._ohlcMem[key]={closes:cl,lows:lo,highs:hi};
}
}catch(e){}
}
ndone++;
if(ndone%20===0){$('scanMsg').textContent='🔬 Enriching '+need.length+' qualified stocks — '+ndone+' done...';$('scanProgress').style.width=Math.min(100,ndone/need.length*100)+'%';}
if(!oh)continue;                          // fetch failed → keep provisional row
let a=analyzeFollower(oh.closes,oh.lows,oh.highs,P,t);
let idx=liveData[t][P].indexOf(r);
if(idx<0)continue;
if(!a){liveData[t][P].splice(idx,1);continue;}   // full OHLC says: not qualified
Object.assign(r,{price:a.last,ema:a.ema,distPct:a.distPct,neverBroke:a.neverBroke,respectBars:a.respectBars,breaks:a.breaks,patterns:a.patterns||[],streak:Math.min(99,a.tests),score:a.score,signal:a.signal,grade:a.grade,tests:a.tests,rejections:a.rejections,slope:a.slope,setup:a.setup,fresh:a.fresh,breakdown:a.breakdown,respect:a.score,reasons:[(a.neverBroke ? 'Perfect '+a.respectBars+'-bar support on '+P+' EMA' : 'High-respect '+P+' EMA trend ('+a.breaks+' breaks)'),a.rejections+' successful EMA rejections',a.slope+' EMA'],needsOHLC:false});
}
}
await Promise.allSettled(Array.from({length:Math.min(6,need.length)},()=>ohlcWorker()));
}

$('scanProgress').style.width='100%';
// Rank every bucket: STRONG SELL first, then fresh setups, then follower score.
// MTF PRIORITY: stocks strong on MORE timeframes float to the top (small boost
// per extra timeframe where the same stock qualified on the same level).
for(let t of TFS){for(let P of EMA_PERIODS){
let arr=liveData[t][P];if(!arr)continue;
let mtfCount={};
arr.forEach(r=>{mtfCount[r.symbol]=0;});
TFS.forEach(t2=>{(liveData[t2][P]||[]).forEach(x=>{if(mtfCount[x.symbol]!=null)mtfCount[x.symbol]++;});});
arr.forEach(r=>{r.mtf=mtfCount[r.symbol]||1;});
arr.sort((a,b)=>{
let sa=(a.signal==='STRONG SELL'?2:a.signal==='SELL'?1:0),sb=(b.signal==='STRONG SELL'?2:b.signal==='SELL'?1:0);
return sb-sa||((b.fresh?1:0)-(a.fresh?1:0))||((b.mtf||1)-(a.mtf||1))||((b.score||0)-(a.score||0))||((b.neverBroke?1:0)-(a.neverBroke?1:0))||a.distPct-b.distPct;});
}}
let found=EMA_PERIODS.reduce((a,P)=>a+(foundBy[P]||0),0);
let totalScanned=Math.min(done,total);
let qual2=TFS.reduce((a,t)=>a+EMA_PERIODS.reduce((s2,P)=>s2+((liveData[t][P]||[]).length),0),0);
let freshN=TFS.reduce((a,t)=>a+EMA_PERIODS.reduce((s2,P)=>s2+((liveData[t][P]||[]).filter(r=>r.fresh).length),0),0);
let folN=TFS.reduce((a,t)=>a+EMA_PERIODS.reduce((s2,P)=>s2+((liveData[t][P]||[]).filter(r=>(r.score||0)>=70).length),0),0);
let dN=EMA_PERIODS.reduce((s2,P)=>s2+((liveData.D[P]||[]).length),0);
let wN=EMA_PERIODS.reduce((s2,P)=>s2+((liveData.W[P]||[]).length),0);
let mN=EMA_PERIODS.reduce((s2,P)=>s2+((liveData.M[P]||[]).length),0);
let iN=INTRAS.reduce((s3,t)=>s3+EMA_PERIODS.reduce((s4,P)=>s4+((liveData[t][P]||[]).length),0),0);
if(found===0){
$('scanMsg').innerHTML=`Scan could not find qualifying stocks.<br><span style="font-size:11px;color:#8f9db8">${totalScanned} scanned · all proxies may be rate-limiting — wait a minute, then Retry Scan.</span>`;
}else{
$('scanMsg').textContent=`Scan complete · ${totalScanned} scanned · D:${dN} W:${wN} M:${mN} I:${iN} qualified · ${folN} followers · ${freshN} fresh setups`;
}
if(found>0){$('aiAnalysisSection').style.display='block';}

$('satSyncBtn').disabled=false;
contentVisible=true;
saveLive();
renderEMAButtons();
renderOverview();
render();
}


// ═══════════════════════════════════════════════════════
// AI Analysis via Sarvam AI
// ═══════════════════════════════════════════════════════
async function aiAnalyzeStocks(){
let stocks=getLive();
let SARVAM_API_KEY=getSarvamKey();
if(!SARVAM_API_KEY){
let k=prompt('Paste your Sarvam AI API key (it will be saved only in this browser):','');
if(!k)return;
try{localStorage.setItem('sarvamApiKey',k.trim())}catch(e){}
SARVAM_API_KEY=k.trim();
}
if(!stocks||stocks.length===0){alert('No live-scanned stocks to analyze. Run Live Scan first!');return;}
// Full-universe scans can find 700+ stocks — cap the AI prompt to the top 50
// by distance so the request stays within API limits
let sorted=stocks.slice().sort((a,b)=>b.distPct-a.distPct);
let top50=sorted.slice(0,50);
let symList=top50.map(s=>`${s.symbol} (price ${s.price}, ${currentEMA} level ${s.ema}, ${s.distPct}% below)`).join(', ');
if(stocks.length>50)symList+=` … plus ${stocks.length-50} more (analyzing top 50 of ${stocks.length})`;
let btn=$('aiAnalyzeBtn');
let out=$('aiAnalysisContent');
btn.disabled=true;btn.textContent='🤖 Analyzing...';
out.style.display='block';
out.innerHTML='<span style="color:#8f9db8">🤖 Sarvam AI is analyzing your stocks... please wait...</span>';
try{
let res=await fetch(SARVAM_API_URL,{
method:'POST',
headers:{'Content-Type':'application/json','api-key':SARVAM_API_KEY},
body:JSON.stringify({
model:'sarvam-m',
messages:[
{role:'system',content:'You are an expert cryptocurrency market analyst specializing in moving-average level analysis (201/101/51/21/11) on Binance-listed crypto pairs like BTCUSD, ETHUSD, SOLUSD. Provide concise, actionable insights in simple English. Keep it short - max 6-8 lines.'},
{role:'user',content:`I just ran a ${TF_META[TF].lbl.toLowerCase()} ${currentEMA} level scan on cryptocurrencies listed on Binance (BTCUSD/BTCUSDT style pairs) and found these coins trading BELOW their ${currentEMA} ${TF_META[TF].lbl.toLowerCase()} moving-average level — these are SELL candidates in downtrends where the EMA acts as resistance: ${symList}. Please give me: 1) Top 3 best SELL candidates with brief reasoning 2) Risk warning for any coins trading too far below their level (short-squeeze risk) 3) One line general advice. Keep it very concise.`}
],
temperature:0.3,
max_tokens:500
})
});
if(!res.ok){
let errText=await res.text();
throw new Error('API error: '+res.status+' '+errText.substring(0,200));
}
let data=await res.json();
let aiText=data.choices&&data.choices[0]&&data.choices[0].message?data.choices[0].message.content:'No response from AI.';
out.innerHTML=aiText.replace(/\n/g,'<br>');
btn.textContent='✅ Analyzed';
btn.disabled=false;
}catch(e){
out.innerHTML='<span style="color:#ff6b6b">⚠️ AI Analysis failed: '+e.message+'</span><br><span style="color:#8f9db8;font-size:11px">Make sure your Sarvam AI API key is valid and has credits.</span>';
btn.textContent='🤖 Retry Analysis';
btn.disabled=false;
}
}

function computeEMAJS(closes,period){
let k=2/(period+1);
let ema=closes[0];
for(let i=1;i<closes.length;i++)ema=closes[i]*k+ema*(1-k);
return Math.round(ema*100)/100;
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
init();
</script>
